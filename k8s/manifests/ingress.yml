apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-bite
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: smart-bite.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: smart-bite-service
            port:
              number: 8080